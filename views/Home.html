<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->

        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="admin">
        <nav>
            <header>
                <h3 class="item d-none">DUC FOOD</h3>
                <i class="fa-solid fa-store item"></i>
                <div class="icon">
                    <i class="fa-solid fa-circle-half-stroke"></i>
                </div>
            </header>
            <ul class="menu-show">
                <li><i class="fa-solid fa-users-gear"></i>
                    <p class="item d-none">DASHBOARD</p>
                </li>
                <li><i class="fa-solid fa-file"></i>
                    <p class="item d-none">RESEVATION</p>
                </li>
                <li><i class="fa-solid fa-circle-half-stroke"></i>
                    <p class="item d-none">ODER FOOD</p>
                </li>
                <li><i class="fa-brands fa-discord"></i>
                    <p class="item d-none">BILL</p>
                </li>
                <li><i class="fa-brands fa-apple"></i>
                    <p class="item d-none">INFORMATION</p>
                </li>
            </ul>
        </nav>
        <main>
            <header>
                <ul>
                    <li><i class="fa-solid fa-magnifying-glass"></i></li>
                    <li><i class="fa-solid fa-bell"></i></li>
                    <li><i class="fa-solid fa-envelope"></i></li>
                </ul>
                <div class="user"><i class="fa-solid fa-user-secret"></i></div>
            </header>
            <section class="pb-4">
                <div class="box">
                    <div class="container">
                        <div class="row row-cols-lg-4 row-cols-2 row-cols-1">
                            <div class="col">
                                <div class="card">
                                    <div class="bg-primary">
                                        <img src="" alt="">
                                        <h4></h4>
                                        <p></p>
                                        <button>

                                        </button>
                                    </div>
                                    <div class="bg-black">
                                        <h4></h4>
                                        <hr>
                                        <div class="">

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="box">
                    <div class="container">
                        <div class="row row-cols-lg-4 row-cols-2 row-cols-1 g-3 mt-3 tables"></div>
                    </div>
                </div>
                <div class="box">
                    <div class="container">
                        <div class="row mt-5">
                            <div class="col-4">
                                <div class="card">
                                    <div class="d-flex p-2 gap-4 justify-content-center align-items-center">
                                        <i class="fa-solid fa-plate-wheat"></i>
                                        <h5>Choose a table</h5>
                                        <button class="px-4 text-light bg-success rounded-2"><i
                                                class="fa-solid fa-cart-shopping"></i> ODER</button>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 position-relative px-0">
                                <input type="text" placeholder="Search" class="rounded-2 w-100 p-2 ">
                                <button
                                    class="text-light bg-success rounded-2 p-2 position-absolute bottom-0 end-0">Submit
                                    Now</button>
                            </div>
                            <div class="col-2">
                                <button data-bs-toggle="modal" data-bs-target="#addfood"
                                    class="d-flex w-100 h-100 align-items-center justify-content-center gap-3 p-1 rounded-2 bg-success text-light w-50">
                                    <i class="fa-solid fa-circle-plus"></i>
                                    <h4>Add Food</h4>
                                </button>
                            </div>
                        </div>
                        <div class="row row-cols-lg-4 row-cols-2 row-cols-1 foods">

                        </div>
                    </div>
                </div>
                <div class="box">
                    <div class="container">
                        <div class="row row-cols-lg-4 row-cols-2 row-cols-1 thep">
                        </div>
                    </div>
                </div>
    </div>
    <div class="box">info</div>
    </section>

    </main>
    </div>
    <!-- Modal booking -->
    <div class="modal fade" id="booking" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title d-flex gap-2" id="exampleModalLabel">Modal Booking <p class="idbooking">1</p>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <div class="d-flex gap-2 align-items-center mb-2">
                            <i class="fa-solid fa-user text-primary"></i>
                            <label class="fw-bold">CUSTOMER NAME</label>
                        </div>
                        <input type="text" class="w-100 p-2 rounded-2" placeholder="Enter your customer name"
                            id="customername">
                    </div>
                    <div class="form-group mt-3">
                        <div class="d-flex gap-2 align-items-center mb-1">
                            <i class="fa-solid fa-users text-primary"></i>
                            <label class="fw-bold">QUANTITY</label>
                        </div>
                        <input type="number" class="w-100 p-2 rounded-2" placeholder="Enter your quantity"
                            id="quantity">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-warning" id="booking-table">Booking</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal add food -->
    <div class="modal fade" id="addfood" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success">
                    <h5 class="modal-title d-flex gap-2" id="exampleModalLabel">Modal Add Food<p class="idaddfood">1</p>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <div class="d-flex gap-2 align-items-center mb-2">
                            <label class="fw-bold">NAME</label>
                        </div>
                        <input type="text" class="w-100 p-2 rounded-2" placeholder="Enter food name" id="namefood">
                    </div>
                    <div class="form-group mt-3">
                        <div class="d-flex gap-2 align-items-center mb-1">
                            <label class="fw-bold">PRICE</label>
                        </div>
                        <input type="number" class="w-100 p-2 rounded-2" placeholder="Enter price" id="pricefood">
                    </div>
                    <div class="form-group mt-3 text-center">
                        <div class="d-flex gap-2 align-items-center mb-2">
                            <label class="fw-bold">IMGE</label>
                        </div>
                        <input type="file" class="w-100 p-2 rounded-2" id="filefood">
                        <img class="w-50"
                            src="https://t4.ftcdn.net/jpg/19/32/70/21/360_F_1932702158_ZlrlO4IbOc0qJcu1FNMb0SjSUgg7cfAY.jpg"
                            alt="" id="imgfood">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" id="afd">ADD FOOD</button>
                </div>
            </div>
        </div>
    </div>
    <!--Modal edit-->
    <div class="modal fade" id="deletefood" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-light">
                    <h5 class="modal-title d-flex gap-2" id="exampleModalLabel">Modal delete<p class="iddeleted">1</p>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h6>Bạn có đồng ý xóa món ăn này hay không ?</h6>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-success" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger ros">DELETE FOOD</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/Home.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/cloudinaryConfig.js"></script>
    <script src="../js/getTable.js"></script>
    <script src="../js/getfood.js"></script>
    <script src="../js/g.js"></script>

        crossorigin="anonymous"></script>

</html>
