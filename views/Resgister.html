<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/GG.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"

        crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>
    <div class="hello">
        <div class="duc">
            <div class="row m-auto">
                <div class="col bg-danger p-5 d-flex justify-content-center align-items-center flex-column left">
                    <h2>Chào mừng trở lại!</h2>
                    <p>Để giữ kết nối với chúng tôi, vui lòng đăng nhập
                        bằng thông tin cá nhân của bạn
                    </p>
                    <button class="w-100 bg-success rounded-3 text-light">Đăng Nhập</button>
                </div>
                <div class="col bg-light p-5 right">
                    <div class="d-flex fs-1 align-items-center justify-content-center">
                        <i class="fa-solid fa-user-secret"></i>
                        <h1>Tạo tài khoản</h1>
                    </div>
                    <div class="d-flex gap-2 justify-content-center mt-3">
                        <i class="fa-brands fa-facebook"></i>
                        <i class="fa-brands fa-google"></i>
                        <i class="fa-brands fa-linkedin-in"></i>
                    </div>
                    <p class="text-center">hoặc sử dụng email để đăng ký</p>
                    <input class="w-100 mt-3 p-2 rounded-3" type="text" placeholder="Họ và tên">
                    <input class="w-100 mt-3 p-2 rounded-3" type="email" placeholder="Email">
                    <input class="w-100 mt-3 p-2 rounded-3" type="text" placeholder="Mật khẩu">
                    <input class="w-100 mt-3 p-2 rounded-3" type="text" placeholder="Xác nhận mật khẩu">
                    <button class="w-100 mt-3 rounded-4 bg-success text-light p-2">Đăng ký</button>
                </div>
            </div>
        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
