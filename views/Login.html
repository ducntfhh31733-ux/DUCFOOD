<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../css/hello.css">
</head>

<body>
    <div class="hello">
        <div class="login">
            <div class="row kl">
                <div class="col bg-white m-0 p-5 left">
                    <div class="d-flex align-items-center justify-content-center gap-4">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <h1>Đăng nhập</h1>
                    </div>
                    <div class="d-flex gap-3 justify-content-center mt-3">
                        <i class="fa-brands fa-facebook text-primary"></i>
                        <i class="fa-brands fa-google text-warning"></i>
                        <i class="fa-brands fa-linkedin-in text-info"></i>
                    </div>
                    <p class="mt-2">Hoặc sử dụng tài khoảng của bạn</p>
                    <input class="w-100 p-2 rounded-2" type="email" placeholder="Email" id="email">
                    <input class="w-100 p-2 rounded-2 mt-3" type="password" placeholder="Mật khẩu" id="password">
                    <button class="w-100 p-2 rounded-2 mt-3 bg-primary text-light" id="kl">Đăng nhập</button>
                    <p class="text-center mt-3">Quên mật khẩu</p>
                </div>
                <div class="col m-0 bg-danger d-flex flex-column justify-content-center align-items-center right">
                    <h1>Xin Chào Bạn</h1>
                    <p class="text-center">Nhập thông tin cá nhân của bạn và bắt đầu hành <br>
                        trình với chúng tôi
                    </p>
                    <button class="w-100 rounded-4 bg-success text-white" id="dangky">Đăng ký</button>
                </div>
            </div>
        </div>
        <script src="../js/api.js"></script>
        <script src="../js/Login.js"></script>
    </div>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
